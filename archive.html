<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DecisionHub | Arşiv Listesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">DecisionHub</a>
      <ul class="nav-links">
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="archive.html" class="active">Arşiv Listesi</a></li>
        <li><a href="add.html">Öğe Ekle</a></li>
        <li><a href="stats.html">İstatistikler</a></li>
        <li><a href="contact.html">İletişim</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
        <div>
          <h2> İzleme & Çalışma Arşivi</h2>
          <p style="color: var(--text-muted);">localStorage üzerinde kayıtlı içeriklerinizi kategoriye göre filtreleyip yönetebilirsiniz.</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-sm" style="background: #64748b;" onclick="resetSampleData()">Örnek Verileri Yükle</button>
          <a href="add.html" class="btn btn-sm">+ Yeni Öğe Ekle</a>
        </div>
      </div>

      <!-- Kategori Filtreleme Barı -->
      <div style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;">
        <label for="archiveCategoryFilter" style="margin-bottom: 0;">Kategoriye Göre Filtrele:</label>
        <select id="archiveCategoryFilter" onchange="renderArchiveTable()" style="width: auto; min-width: 180px;">
          <option value="ALL">Tüm Kategoriler</option>
          <option value="Film">Film</option>
          <option value="Dizi">Dizi</option>
          <option value="Kitap">Kitap</option>
          <option value="Kod">Kod Parçacığı / Çalışma</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Başlık</th>
              <th>Kategori</th>
              <th>Durum</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody id="archiveTableBody">
            <!-- JS ile localStorage'dan okunup doldurulacak -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>DecisionHub &copy; 2026 - Nehir Kaplan (23291722)</footer>
  <script src="script.js"></script>
</body>
</html>
